[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openapi32lint"
version = "0.1.0"
description = "Lint and validate OpenAPI 3.1 -> 3.2 migrations: detect broken nullable/allOf/enums/$ref-siblings and auto-fix them safely. Pure stdlib + PyYAML."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{ name = "InGarlicBreadWeTrust" }]
keywords = ["openapi", "openapi31", "openapi32", "json-schema", "2020-12",
               "lint", "migration", "api", "3.1", "3.2"]
classifiers = [
      "Programming Language :: Python :: 3",
      "Topic :: Software Development :: Quality Assurance",
      "Topic :: Utilities",
      "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=5.4"]
dev = ["PyYAML>=5.4"]

[project.scripts]
openapi32lint = "openapi32lint.cli:main"

[tool.setuptools]
packages = ["openapi32lint"]

[tool.setuptools.package-data]
openapi32lint = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/IN-GARLICE-LOCAL/openapi32lint"
Issues = "https://github.com/IN-GARLICE-LOCAL/openapi32lint/issues"
