# A small OpenAPI 3.2 doc with intentional 3.1->3.2 hazards, for demos & tests.
openapi: 3.2.1
info:
      title: Example API
      version: 1.0.0
      description: Demonstrates the kinds of issues openapi32lint detects.
paths:
      /pets:
            get:
                  operationId: listPets
                  responses:
                        "200":
                              description: OK
                              content:
                                    application/json:
                                          schema:
                                                type: array
                                                items:
                                                      $ref: "#/components/schemas/Pet"
            post:
                  operationId: createPet
                  requestBody:
                        content:
                              application/json:
                                    schema:
                                          $ref: "#/components/schemas/Pet"
                  responses:
                        "201":
                              description: created
components:
      schemas:
            Pet:
                  type: object
                  required: [id]
                  properties:
                        id:
                              type: integer
                        name:                  # R32-001: top-level 'nullable'
                              type: string
                              nullable: true
                        bornAt:               # R32-005: boolean exclusive limit
                              type: string
                              format: date
                              exclusiveMinimum: true
                        refWithSiblings:      # R32-004: $ref ignored siblings
                              $ref: "#/components/schemas/Owner"
                              format: date
                        allOfNullable:        # R32-002: allOf + nullable is broken
                              allOf:
                                    - $ref: "#/components/schemas/Owner"
                              nullable: true
            Owner:
                  type: object
                  properties:
                        name:
                              type: string
